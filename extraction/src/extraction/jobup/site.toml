# Configuration du site jobup.ch : tout ce qui concerne jobup se règle ici.
# La commande ne reçoit que le nom du site (= le nom de ce dossier).
#
# [db_storage]     = stockage des tables (IDbStorage)
# [file_storage]   = stockage des fichiers bruts, le HTML (IFileStorage)
#   class          = la classe, format "module:Classe"
#   options        = ses paramètres (aucun pour Postgres et RustFS : la connexion
#                    est lue dans infra/.env par la classe)
#
# [extraction]
# class            = classe qui extrait le site (ISiteExtractionUseCase)
# min_delay_between_requests = politesse envers le site, en secondes
# max_pages        = garde-fou : pages de résultats lues par catégorie (test)
# max_jobs         = garde-fou : pages de détail téléchargées (test)
#                    Sans option, la commande respecte ces limites ; --full les lève.
# [extraction.options] = propres à jobup, lues et validées par JobupExtractionUseCase
# categories       = catégories à lire (slugs d'URL) ; une catégorie = une ligne

[db_storage]
class = "storage.postgres_db_storage:PostgresDbStorage"

[file_storage]
class = "storage.s3_file_storage:S3FileStorage"

[extraction]
class = "extraction.jobup.jobup_extraction_uc:JobupExtractionUseCase"
min_delay_between_requests = 1.0
max_pages = 1
max_jobs = 2

[extraction.options]
categories = [
    "informatique-telecommunications",
]
