# Configuration du site jobup.ch : tout ce qui concerne jobup se règle ici.
# La commande ne reçoit que le nom du site (= le nom de ce dossier).
#
# storage          = classe qui stocke les données (IStorage), format "module:Classe"
# storage_options  = ses paramètres
#
# [extraction]
# class            = classe qui extrait le site (ISiteExtraction)
# min_delay_between_requests = politesse envers le site, en secondes
# max_pages        = garde-fou : pages de résultats lues par catégorie (test)
# max_jobs         = garde-fou : pages de détail téléchargées (test)
#                    Sans option, la commande respecte ces limites ; --full les lève.
# [extraction.options] = propres à jobup, lues et validées par JobupExtraction
# categories       = catégories à lire (slugs d'URL) ; une catégorie = une ligne
# parser           = classe qui lit les pages téléchargées (IParser), "module:Classe" ;
#                    changer de parseur = changer cette ligne

storage = "storage:LocalParquetStorage"
storage_options = { data_dir = "data" }

[extraction]
class = "extraction.jobup.jobup_extraction:JobupExtraction"
min_delay_between_requests = 1.0
max_pages = 1
max_jobs = 2

[extraction.options]
parser = "extraction.jobup.jobup_parser:JobupParser"
categories = [
    "informatique-telecommunications",
]
