[project]
name = "jobcompass-extraction"
version = "0.1.0"
description = "Extraction engine and one folder per site: raw job infos, raw job details"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-catalog",
    "jobcompass-contracts",
    "jobcompass-interfaces",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jobcompass-storage",  # the tests use the real local storage
]

[tool.uv.sources]
jobcompass-catalog = { workspace = true }
jobcompass-contracts = { workspace = true }
jobcompass-interfaces = { workspace = true }
jobcompass-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction"]
exclude = ["**/tests"]

[tool.pytest.ini_options]
# tests/ : common code ; src/extraction/<site>/tests/ : each site, next to its code
testpaths = ["tests", "src"]
pythonpath = ["."]  # conftest.py, shared by the engine and site tests
