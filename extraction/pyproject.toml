[project]
name = "jobcompass-extraction"
version = "0.1.0"
description = "Extraction of job listings and job pages, raw storage"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-common",
    "jobcompass-contracts",
    "pydantic-settings>=2.6",
    "pyarrow>=18",
    "httpx>=0.27",
]

[project.scripts]
jobcompass-extraction = "extraction.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
jobcompass-common = { workspace = true }
jobcompass-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
