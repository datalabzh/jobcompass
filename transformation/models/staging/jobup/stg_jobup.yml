version: 2

models:
  - name: stg_jobup__job_infos
    description: "Jobs seen on jobup result pages, one row per job and per run."
    columns:
      - name: job_info_id
        description: "Surrogate key: run_id and url."
        data_tests:
          - unique
          - not_null

  - name: stg_jobup__job_details
    description: >-
      jobup job detail pages, one row per page (url, raw_hash), latest
      extraction only.
    columns:
      - name: job_detail_id
        description: "Surrogate key of the page: url and raw_hash."
        data_tests:
          - unique
          - not_null
