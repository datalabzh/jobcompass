version: 2

models:
  - name: stg_jobup__raw_job_info
    description: Offres vues sur les pages de résultats, une ligne par offre et par passage.
    columns:
      - name: run_id
        data_tests: [not_null]
      - name: url
        data_tests: [not_null]
      - name: seen_at
        data_tests: [not_null]

  - name: stg_jobup__raw_job_detail
    description: Fiches téléchargées, une ligne par (url, raw_hash), extraction la plus récente.
    data_tests:
      - unique:
          arguments:
            column_name: "url || '|' || raw_hash"
    columns:
      - name: raw_hash
        data_tests: [not_null]
      - name: url
        data_tests: [not_null]
      - name: payload_format
        data_tests:
          - accepted_values:
              arguments:
                values: [json_ld, paragraphs]
      - name: description
        description: HTML de la source (json_ld) ou paragraphes joints (paragraphs).
        data_tests: [not_null]
      - name: title
        description: Titre du JSON-LD ; nul pour une fiche lue en paragraphes.
