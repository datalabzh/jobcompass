[project]
name = "jobcompass"
version = "0.1.0"
description = "Skill-cluster analysis of the Swiss Romandy job market"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17.5"]

[tool.uv.workspace]
members = ["common", "contracts", "extraction"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# D1  = a docstring is required on every module, class, method and function
# ANN = every function argument and return value is typed
select = ["E", "F", "I", "W", "D1", "ANN"]
ignore = [
    "D104", # empty __init__.py files carry no header (project convention)
    "D107", # __init__ is documented by its class docstring
]

[tool.ruff.lint.isort]
known-first-party = [
    "interfaces",
    "contracts",
    "extraction",
]
