[project]
name = "jobcompass-storage"
version = "0.1.0"
description = "Storage shared by the JobCompass bricks: PostgreSQL tables, S3 raw files"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-contracts",
    "boto3>=1.35",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
jobcompass-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
