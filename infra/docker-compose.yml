# Infrastructure locale de JobCompass.
# Lancement depuis la racine du dépôt :
#   docker compose -f infra/docker-compose.yml up -d --wait
# Les variables sont lues dans infra/.env (modèle : infra/.env.example).

services:
  postgres:
    image: postgres:17
    container_name: jobcompass-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Ports publiés sur la machine seulement (127.0.0.1) : ni la base ni le
    # stockage ne sont joignables depuis le réseau. Le service pipeline passe par
    # le réseau Docker. Accès depuis un autre poste : tunnel SSH.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL exécutés au premier démarrage (volume vide) uniquement.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stockage objet compatible S3 (remplace MinIO, dont l'édition
  # communautaire n'est plus maintenue). Conserve le HTML brut des offres.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: jobcompass-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  # Crée le bucket au démarrage s'il n'existe pas, puis s'arrête.
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: jobcompass-rustfs-init
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url "$$S3_ENDPOINT" s3api list-buckets > /dev/null 2>&1; do
          echo "En attente de RustFS..."
          sleep 2
        done
        aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2> /dev/null \
          || aws --endpoint-url "$$S3_ENDPOINT" s3 mb "s3://$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET prêt."
    restart: "no"

  # Chaîne JobCompass planifiée par supercronic (image : orchestration/Dockerfile).
  # orchestration/ est monté en volume : après un changement de l'heure
  # (jobcompass.cron) ou du mode (orchestration/.env), il suffit de
  #   docker compose -f infra/docker-compose.yml restart pipeline
  # Après un changement du code Python ou dbt : reconstruire l'image avec
  #   docker compose -f infra/docker-compose.yml up -d --build pipeline
  pipeline:
    build:
      context: ..
      dockerfile: orchestration/Dockerfile
    image: jobcompass-pipeline
    container_name: jobcompass-pipeline
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    # Connexions lues dans infra/.env ; dans le réseau Docker, on joint les
    # conteneurs par leur nom et leur port interne (pas les ports publiés).
    # Réglages de l'extraction : extraction/.env, facultatif.
    env_file:
      - .env
      - path: ../extraction/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      S3_HOST: rustfs
      S3_API_PORT: "9000"
    volumes:
      - ../orchestration:/app/orchestration:ro
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:
