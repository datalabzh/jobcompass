[project]
name = "jobcompass-ingestion"
version = "0.1.0"
description = "Discovery and fetch of job offers, raw storage"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-contracts",
    "pydantic-settings>=2.6",
    "dependency-injector>=4.46",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
jobcompass-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcompass_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
