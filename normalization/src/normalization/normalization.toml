# Configuration commune de la normalisation : partagée par tous les normaliseurs.
# Chaque normaliseur a son dossier (ex. fake/) avec son propre normalizer.toml :
# créer ou tester un normaliseur ne touche jamais ce fichier.
#
# default          = normaliseur utilisé sans option --normalizer (nom de son dossier) :
#                    le choix de production, modifié seulement par une décision d'équipe
# [db_storage]     = stockage des tables (IDbStorage) ; le même que celui des sites
#   class          = la classe, format "module:Classe"
#   options        = ses paramètres (aucun pour Postgres : la connexion est lue dans
#                    infra/.env par la classe)

default = "fake"

[db_storage]
class = "storage.postgres_db_storage:PostgresDbStorage"
