[project]
name = "jobcompass-normalization"
version = "0.1.0"
description = "Normalization common to every site: extracted jobs -> normalized jobs"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-catalog",
    "jobcompass-contracts",
    "jobcompass-interfaces",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jobcompass-storage",  # the tests use the real local storage
]

[tool.uv.sources]
jobcompass-catalog = { workspace = true }
jobcompass-contracts = { workspace = true }
jobcompass-interfaces = { workspace = true }
jobcompass-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalization"]
exclude = ["**/tests"]

[tool.pytest.ini_options]
# tests/ : common code ; src/normalization/<normalizer>/tests/ : each normalizer
testpaths = ["tests", "src"]
