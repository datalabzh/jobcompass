# Projet dbt de JobCompass (ADR-0002) : Python dépose le brut, dbt met en forme.
#   sources  (bronze) : les Parquet bruts, lus tels quels, jamais modifiés
#   staging  (silver) : un modèle par table brute et par site, stg_<site>__<table>
#   marts    (gold)   : plus tard (normalisation, clusters)
# Lancer depuis la racine du dépôt (chemins relatifs à la racine) :
#   uv run --package jobcompass-dbt dbt build \
#     --project-dir dbt --profiles-dir dbt \
#     --target test   (ou --target real)
# Les vues gardent le chemin relatif de leurs Parquet : les lire depuis la racine.

name: "jobcompass"
version: "0.1.0"
config-version: 2

profile: "jobcompass"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  jobcompass:
    staging:
      +materialized: view

flags:
  require_generic_test_arguments_property: true
  validate_macro_args: true
  send_anonymous_usage_stats: false
