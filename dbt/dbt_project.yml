# Projet dbt de JobCompass (ADR-0002) : Python dépose le brut, dbt met en forme.
#   sources      (bronze) : tables brutes de Postgres (schéma raw) et
#                           config.normalizer, jamais modifiées
#   staging      (silver) : une source mise à plat, sans jointure, en vues
#   intermediate (silver) : jointures et regroupements, en vues
#   marts        (gold)   : produits finaux, en tables
# Schémas écrits : staging, intermediate, marts, dans la base jobcompass_dev
# (target dev, zone de test) ou jobcompass (target real) ; voir
# macros/generate_schema_name.sql.
# Lancer depuis la racine du dépôt :
#   uv run --env-file infra/.env --package jobcompass-dbt dbt build \
#     --project-dir dbt --profiles-dir dbt --target dev   (ou --target real)

name: "jobcompass"
version: "0.1.0"
config-version: 2

profile: "jobcompass"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  jobcompass:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      jobs:
        +tags: ["jobs"]
      skills:
        +tags: ["skills"]

flags:
  require_generic_test_arguments_property: true
  validate_macro_args: true
  send_anonymous_usage_stats: false
