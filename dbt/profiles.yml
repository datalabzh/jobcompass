# Profil dbt, versionné dans le projet (aucun fichier dans ~/.dbt/), passé à dbt
# par --profiles-dir dbt. Connexion lue dans les variables POSTGRES_* de
# infra/.env, chargées par uv : toujours lancer dbt depuis la racine du dépôt avec
#   uv run --env-file infra/.env --package jobcompass-dbt dbt ...
# Les valeurs par défaut ne servent qu'à dbt parse (pre-commit), qui ne se
# connecte pas.
#   test : lit raw_test (zone de test), écrit dans analytics_test_<couche>
#   real : lit raw, écrit dans analytics_<couche>

jobcompass:
  target: test
  outputs:
    test: &postgres
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'jobcompass') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'jobcompass') }}"
      schema: analytics_test
      threads: 4
    real:
      <<: *postgres
      schema: analytics
