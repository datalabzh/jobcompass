version: 2

models:
  - name: stg_config__normalizers
    description: >-
      Known normalizers, one row per normalizer and version. Exactly one
      is current (unique index in Postgres).
    columns:
      - name: hash_normalizer_id
        data_type: text
        description: "Key of the normalizer: hash of its name and version."
        data_tests:
          - unique
          - not_null

      - name: normalizer_name
        data_type: text
        description: "Name of the normalizer."
        data_tests:
          - not_null

      - name: normalizer_version
        data_type: text
        description: "Version of the normalizer."
        data_tests:
          - not_null

      - name: normalizer_description
        data_type: text
        description: "What the normalizer does, in one sentence."

      - name: is_current
        data_type: boolean
        description: "True for the normalizer used by the marts."
        data_tests:
          - not_null

      - name: updated_at
        data_type: timestamp with time zone
        description: "Last change of the row, in UTC."

  - name: stg_config__sites
    description: >-
      Sites known to JobCompass, one row per site. Every site_name found in
      the data must be declared here (relationships tests of the unioned
      models).
    columns:
      - name: site_name
        data_type: text
        description: >-
          Name of the site: the name of its folder in extraction/ and
          the source of its rows, e.g. jobup.
        data_tests:
          - unique
          - not_null

      - name: site_description
        data_type: text
        description: "What the site is, in one sentence."

      - name: updated_at
        data_type: timestamp with time zone
        description: "Last change of the row, in UTC."
