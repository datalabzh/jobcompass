# Raw tables of jobup.ch (bronze), written by the Python extraction.
# Files: <root>/<table>/source=jobup/date=<day>/part-*.parquet, root = the one
# of the Python storage: data/test (target test) or data (target real),
# relative to the repository root.
# union_by_name: files of different contract versions are read together.
# hive_partitioning disabled: source is already a column, date (write day) is
# not useful.

version: 2

sources:
  - name: jobup
    description: "Raw tables of jobup.ch, as written by the extraction."
    meta:
      external_location: >-
        read_parquet(
        '{{ "data/test" if target.name == "test" else "data" }}/{name}/source=jobup/*/*.parquet',
        union_by_name = true, hive_partitioning = false)
    tables:
      - name: raw_job_info
        description: >-
          One row per job seen on a result page, per run (RawJobInfo).

      - name: raw_job_detail
        description: >-
          One row per detail page downloaded, with its raw block
          (RawJobDetail).
