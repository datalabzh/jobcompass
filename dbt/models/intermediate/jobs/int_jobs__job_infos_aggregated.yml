version: 2

models:
  - name: int_jobs__job_infos_aggregated
    description: >-
      jobup job offers seen on result pages, one row per offer, with its
      presence (first and last sighting, active or not) and its latest
      listing card.
    columns:
      - name: hash_job_id
        data_type: text
        description: "Key of the job offer: hash of source and url."
        data_tests:
          - unique
          - not_null

      - name: job_url
        data_type: text
        description: "URL of the job detail page on jobup."
        data_tests:
          - not_null

      - name: site_name
        data_type: text
        description: "Site the offer comes from."

      - name: job_title
        data_type: text
        description: "Job title from the latest listing card."

      - name: company_name
        data_type: text
        description: "Hiring company from the latest listing card."

      - name: job_place
        data_type: text
        description: "Place of the job from the latest listing card."

      - name: runs_seen
        data_type: bigint
        description: "Number of runs that saw the offer."
        data_tests:
          - not_null

      - name: is_active
        data_type: boolean
        description: >-
          True if seen in the latest completed run of at least one
          category.
        data_tests:
          - not_null

      - name: initial_published_at
        data_type: timestamp with time zone
        description: >-
          First publication of the offer, from the latest listing
          card.

      - name: published_at
        data_type: timestamp with time zone
        description: >-
          Latest publication of the offer, from the latest listing
          card.

      - name: first_seen_at
        data_type: timestamp with time zone
        description: "First sighting of the offer on a result page, in UTC."
        data_tests:
          - not_null

      - name: last_seen_at
        data_type: timestamp with time zone
        description: "Latest sighting of the offer on a result page, in UTC."
        data_tests:
          - not_null
