version: 2

models:
  - name: skills__job_skills
    description: >-
      Skills of the job offers of every site, one row per offer and
      canonical skill, with the days the offer was seen. Skills of the latest detail
      page of each offer, normalized by the current normalizer. No
      aggregation: counts by day, week or month are computed from this
      model.
    columns:
      - name: hash_job_skill_id
        data_type: text
        description: "Key of the row: hash of hash_job_id and canonical_skill."
        data_tests:
          - unique
          - not_null

      - name: hash_job_id
        data_type: text
        description: "Key of the job offer."
        data_tests:
          - not_null

      - name: hash_html_id
        data_type: text
        description: >-
          SHA-256 of the raw HTML of the detail page the skills come from,
          its file name in the object storage.
        data_tests:
          - not_null

      - name: job_url
        data_type: text
        description: "URL of the job detail page on its site."
        data_tests:
          - not_null

      - name: canonical_skill
        data_type: text
        description: "Canonical form of the skill, e.g. postgresql."
        data_tests:
          - not_null

      - name: raw_skill
        data_type: text
        description: "Skill as written in the source, e.g. Postgres."

      - name: skill_origin
        data_type: text
        description: >-
          Where the skill comes from: declared by the source or
          detected in the text.
        data_tests:
          - not_null

      - name: normalizer_name
        data_type: text
        description: "Name of the current normalizer."

      - name: normalizer_version
        data_type: text
        description: "Version of the current normalizer."

      - name: model_name
        data_type: text
        description: "Name of the model used."

      - name: model_version
        data_type: text
        description: "Version of the model used."

      - name: is_active
        data_type: boolean
        description: >-
          True if seen in the latest completed run of at least one
          category of its site.
        data_tests:
          - not_null

      - name: first_seen_date
        data_type: date
        description: "First day the offer was seen on a result page (UTC)."
        data_tests:
          - not_null

      - name: last_seen_date
        data_type: date
        description: "Latest day the offer was seen on a result page (UTC)."
        data_tests:
          - not_null
