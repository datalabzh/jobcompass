[project]
name = "jobcompass-entrypoints"
version = "0.1.0"
description = "Entry points of the JobCompass bricks (command lines today)"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-contracts",
    "jobcompass-interfaces",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

# Each brick is optional: installing the extraction command does not install the
# NLP of the normalization (and the other way round).
[project.optional-dependencies]
extraction = [
    "jobcompass-extraction",
    "jobcompass-storage",
]
normalization = [
    "jobcompass-normalization",
    "jobcompass-storage",
]

[project.scripts]
jobcompass-extraction = "entrypoints.extraction_cli:main"
jobcompass-normalization = "entrypoints.normalization_cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jobcompass-catalog",  # the tests write tables of the catalog
    "jobcompass-extraction",  # the tests cover both commands
    "jobcompass-normalization",
    "jobcompass-storage",
]

[tool.uv.sources]
jobcompass-catalog = { workspace = true }
jobcompass-contracts = { workspace = true }
jobcompass-interfaces = { workspace = true }
jobcompass-extraction = { workspace = true }
jobcompass-normalization = { workspace = true }
jobcompass-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entrypoints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
