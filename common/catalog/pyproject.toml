[project]
name = "jobcompass-catalog"
version = "0.1.0"
description = "Catalog of the JobCompass tables: where the data of each contract lives"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
