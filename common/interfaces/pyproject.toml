[project]
name = "jobcompass-interfaces"
version = "0.1.0"
description = "Interfaces shared by every JobCompass brick and site (no logic)"
requires-python = ">=3.12"
dependencies = [
    "jobcompass-contracts",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
jobcompass-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
